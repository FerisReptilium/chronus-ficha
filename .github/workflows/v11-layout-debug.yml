name: CHRONUS v1.1 layout debug

on:
  push:
    branches: [editorial-v1.1]

permissions:
  contents: read

jobs:
  inspect-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Inspect mobile drawer
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844}});
            await p.goto('http://127.0.0.1:8080/#/home',{waitUntil:'domcontentloaded'});
            await p.waitForTimeout(1500);
            const out=await p.evaluate(()=>{
              const d=document.getElementById('mobile-nav-drawer');
              const s=d?getComputedStyle(d):null;
              return {
                guard:!!document.getElementById('chronus-v11-responsive-style'),
                right:s?.right,visibility:s?.visibility,opacity:s?.opacity,pointerEvents:s?.pointerEvents,
                left:d?.getBoundingClientRect().left,rightEdge:d?.getBoundingClientRect().right,
                doc:document.documentElement.scrollWidth,vw:document.documentElement.clientWidth
              };
            });
            console.log('LAYOUT='+JSON.stringify(out));
            await b.close();
            if(!out.guard || out.right!=='0px' || out.doc>out.vw+2) process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
