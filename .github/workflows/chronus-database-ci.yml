name: CHRONUS database baseline and migration chain

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/chronus-database-ci.yml'
  push:
    branches: [rebuild/core-database-baseline]
    paths:
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/chronus-database-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Build isolated migration directory
        run: |
          set -euo pipefail
          rm -rf .chronus-db-ci
          mkdir -p .chronus-db-ci/supabase/migrations
          cp supabase/migrations/000_core_auth_and_characters.sql .chronus-db-ci/supabase/migrations/20261121000000_core_auth_and_characters.sql
          cp supabase/migrations/001_portal_content.sql .chronus-db-ci/supabase/migrations/20261121000100_portal_content.sql
          cp supabase/migrations/002_v11_security_hardening.sql .chronus-db-ci/supabase/migrations/20261121000200_v11_security_hardening.sql
          cp supabase/migrations/003_v12_rls_helper_hardening.sql .chronus-db-ci/supabase/migrations/20261121000300_v12_rls_helper_hardening.sql
          cp supabase/migrations/004_v12_rls_initplan_optimization.sql .chronus-db-ci/supabase/migrations/20261121000400_v12_rls_initplan_optimization.sql
          cp supabase/migrations/005_v12_permissive_policy_consolidation.sql .chronus-db-ci/supabase/migrations/20261121000500_v12_permissive_policy_consolidation.sql
          cp supabase/migrations/20260904160729_add_session_current_objective.sql .chronus-db-ci/supabase/migrations/20261121000600_add_session_current_objective.sql
          cp supabase/migrations/006_chronus_roll_events.sql .chronus-db-ci/supabase/migrations/20261121000700_chronus_roll_events.sql
          cp supabase/migrations/007_chronus_roll_events_privileges.sql .chronus-db-ci/supabase/migrations/20261121000800_chronus_roll_events_privileges.sql
          cp supabase/migrations/008_chronus_roll_events_immutable_grants.sql .chronus-db-ci/supabase/migrations/20261121000900_chronus_roll_events_immutable_grants.sql
          cp supabase/migrations/20261122165137_character_revision_cas.sql .chronus-db-ci/supabase/migrations/20261122165137_character_revision_cas.sql
          cd .chronus-db-ci
          supabase init

      - name: Start a clean local Supabase stack and apply all migrations
        working-directory: .chronus-db-ci
        run: |
          set -euo pipefail
          if ! supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor > supabase-start.log 2>&1; then
            echo "Supabase local bootstrap failed. Sanitized startup log (last 180 lines):"
            sed -E \
              -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[REDACTED_JWT]/g' \
              -e 's/sb_(secret|publishable)_[A-Za-z0-9_-]+/[REDACTED_SUPABASE_KEY]/g' \
              supabase-start.log | tail -n 180
            echo "Docker container summary:"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            exit 1
          fi
          supabase status -o env > ../supabase-local.env

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run JavaScript rules and integration regression tests
        run: |
          node tests/v135_dice_roller.test.js
          node tests/v142_canon_1990.test.js
          node tests/v144_sheet_dice_integration.test.js
          node tests/rules/narrative_resolution.test.js

      - name: Verify all eleven migrations were recorded
        run: |
          set -euo pipefail
          set -a
          source supabase-local.env
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE v_count integer;
          BEGIN
            SELECT count(*) INTO v_count
            FROM supabase_migrations.schema_migrations
            WHERE version IN (
              '20261121000000','20261121000100','20261121000200',
              '20261121000300','20261121000400','20261121000500',
              '20261121000600','20261121000700','20261121000800','20261121000900',
              '20261122165137'
            );
            IF v_count <> 11 THEN
              RAISE EXCEPTION 'Expected 11 recorded migrations, found %', v_count;
            END IF;
          END $$;
          SELECT version, name FROM supabase_migrations.schema_migrations
          ORDER BY version;
          SQL

      - name: Verify Auth profile provisioning and core RLS
        run: |
          set -euo pipefail
          set -a
          source supabase-local.env
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/core_database_baseline.sql

      - name: Run existing v1.2 security and Storage integration suite
        run: |
          set -euo pipefail
          set -a
          source supabase-local.env
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/v12_local_supabase_e2e.sql

      - name: Run real Auth multi-session isolation and concurrent CAS integration
        run: |
          set -euo pipefail
          set -a
          source supabase-local.env
          set +a
          node tests/v146_auth_sync_integration.test.js

      - name: Verify live roll feed RLS and Realtime integration
        run: |
          set -euo pipefail
          set -a
          source supabase-local.env
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/chronus_roll_events.sql

      - name: Stop disposable Supabase stack
        if: always()
        working-directory: .chronus-db-ci
        run: supabase stop --no-backup || true
