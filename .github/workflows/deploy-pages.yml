name: CHRONUS — Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chronus-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package static portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate public portal entry points
        run: |
          set -euo pipefail
          test -s index.html
          test -d css
          test -d js
          test -d assets
          test -s js/config.js
          test -s js/app.js
          echo "CHRONUS static portal structure: PASS"

      - name: Stage public website only
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp -R css js assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          test -s _site/index.html
          test -s _site/js/config.js
          test -s _site/js/app.js
          echo "Staged public files:"
          find _site -maxdepth 2 -type f | sort | head -n 100

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish CHRONUS portal
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published portal and critical assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          if [ -z "${PAGE_URL:-}" ]; then
            echo "GitHub Pages did not return a deployment URL."
            exit 1
          fi

          BASE_URL="${PAGE_URL%/}"
          TMP_FILE="$(mktemp)"
          trap 'rm -f "$TMP_FILE"' EXIT

          fetch_with_retry() {
            local path="$1"
            local label="$2"
            local url="${BASE_URL}${path}"

            echo "Checking ${label}: ${url}"
            curl --fail --silent --show-error \
              --retry 10 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 10 \
              --max-time 30 \
              "$url" --output "$TMP_FILE"

            test -s "$TMP_FILE"
          }

          fetch_with_retry "/" "public homepage"
          grep -q "editorial-media-v14.css" "$TMP_FILE"
          grep -q "js/app.js" "$TMP_FILE"

          fetch_with_retry "/js/config.js" "public runtime configuration"
          fetch_with_retry "/js/app.js" "application entry point"
          fetch_with_retry "/css/editorial-media-v14.css" "editorial media stylesheet"

          echo "CHRONUS post-deploy smoke test: PASS"
