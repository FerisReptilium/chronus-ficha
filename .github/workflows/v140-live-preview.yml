name: CHRONUS v1.4.0 LIVE Private Preview

on:
  push:
    branches:
      - work/v1.4.0-chronus-live-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chronus-live-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static, security and regression QA
        run: |
          node --check js/app.js
          node --check js/router.js
          node --check js/modules/chronus_live_v140.js
          node --check tests/visual/v140_live_preview.js
          for test_file in tests/*.test.js; do node "$test_file"; done

      - name: Install pinned preview browser
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Start private preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/chronus-v140-http.log 2>&1 &
          echo $! > /tmp/chronus-v140-http.pid
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chronus-v140-http.log
          exit 1

      - name: Capture desktop and mobile previews
        run: node tests/visual/v140_live_preview.js

      - name: Upload private preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronus-v140-live-private-preview
          path: artifacts/v140-live-preview
          if-no-files-found: error
          retention-days: 7

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/chronus-v140-http.pid ]; then
            kill "$(cat /tmp/chronus-v140-http.pid)" 2>/dev/null || true
          fi
