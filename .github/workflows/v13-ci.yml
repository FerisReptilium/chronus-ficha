name: CHRONUS v1.3 CI

on:
  push:
    branches:
      - editorial-v1.3
      - hotfix/v1.3.1-art-pack
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  v13-cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      - name: JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/router.js
          node --check js/services/auth.js
          node --check js/services/content.js
          node --check js/services/assets.js
          node --check js/modules/home.js
          node --check js/modules/home_motion.js
          node --check js/modules/chronicle.js
          node --check js/modules/sessions.js
          node --check js/modules/npcs.js
          node --check js/modules/locations.js
          node --check js/modules/documents.js
          node --check js/modules/library.js
          node --check js/modules/sheet_engine.js
          node --check js/modules/hero_video_v135.js
          node --check js/modules/dice_roller_v135.js

      - name: v1.1 regression suite
        run: |
          node tests/v11_delete.test.js
          node tests/v11_library.test.js
          node tests/v11_library_ui.test.js
          node tests/v11_secrets.test.js
          node tests/v11_relations.test.js
          node tests/v11_schedule.test.js

      - name: v1.2 security/performance regressions
        run: |
          node tests/v12_rls_hardening.test.js
          node tests/v12_rls_initplan.test.js
          node tests/v12_permissive_policies.test.js

      - name: v1.3 cinematic hero Phase 1
        run: node tests/v13_cinematic_hero.test.js

      - name: v1.3 Chronicle cinematic scene Phase 2A
        run: node tests/v13_cinematic_chronicle.test.js

      - name: v1.3 Sessions cinematic scene Phase 2B
        run: node tests/v13_cinematic_sessions.test.js

      - name: v1.3 NPC dossier cinematic scene Phase 2C
        run: node tests/v13_cinematic_npcs.test.js

      - name: v1.3 occult Berlin atlas Phase 2D
        run: node tests/v13_cinematic_locations.test.js

      - name: v1.3 confiscated evidence Phase 2E
        run: node tests/v13_cinematic_files.test.js

      - name: v1.3 restricted occult library Phase 2F
        run: node tests/v13_cinematic_library.test.js

      - name: v1.3 Home visual audit and progressive motion Phase 3
        run: node tests/v13_cinematic_motion.test.js

      - name: v1.3 Chronicle internal cinematic page Phase 4A
        run: node tests/v13_cinematic_chronicle_page.test.js

      - name: v1.3 Sessions internal cinematic page Phase 4B
        run: node tests/v13_cinematic_sessions_page.test.js

      - name: v1.3 NPC internal cinematic dossier Phase 4C
        run: node tests/v13_cinematic_npcs_page.test.js

      - name: v1.3 Locations internal cinematic atlas Phase 4D
        run: node tests/v13_cinematic_locations_page.test.js

      - name: v1.3 Files internal cinematic archive Phase 4E
        run: node tests/v13_cinematic_files_page.test.js

      - name: v1.3 Library internal cinematic archive Phase 4F
        run: node tests/v13_cinematic_library_page.test.js

      - name: v1.3 final release readiness QA
        run: node tests/v13_release_qa.test.js

      - name: v1.3.1 cinematic art pack QA
        run: node tests/v131_art_pack.test.js

      - name: v1.3.5 cinematic hero video QA
        run: node tests/v135_hero_video.test.js

      - name: v1.3.5 CHRONUS dice roller QA
        run: node tests/v135_dice_roller.test.js

      - name: Static smoke server
        run: |
          python3 -m http.server 4173 >/tmp/chronus-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          for path in \
            / \
            /index.html \
            /js/app.js \
            /js/router.js \
            /js/modules/sheet_engine.js \
            /js/modules/hero_video_v135.js \
            /js/modules/dice_roller_v135.js \
            /assets/art/hero-berlin-1992.webp \
            /assets/art/chronicle-cover.webp \
            /assets/art/sessions-cover.webp \
            /assets/art/npc-known.webp \
            /assets/art/npc-unknown.webp \
            /assets/art/npc-threat.webp \
            /assets/art/locations-cover.webp \
            /assets/art/documents-cover.webp \
            /assets/art/library-cover.webp \
            /assets/video/v135-hero-berlin-loop.mp4 \
            /assets/video/v135-hero-berlin-loop.webm \
            /assets/video/v135-hero-berlin-poster.webp \
            /css/cinematic-v13.css \
            /css/cinematic-chronicle-page-v13.css \
            /css/cinematic-sessions-page-v13.css \
            /css/cinematic-npcs-page-v13.css \
            /css/cinematic-locations-page-v13.css \
            /css/cinematic-files-page-v13.css \
            /css/cinematic-library-page-v13.css \
            /css/hero-video-v135.css \
            /css/dice-roller-v135.css; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${path}" >/dev/null
          done
          echo "v1.3.5 static smoke: PASS"
